[pytest]
# Use a local temp directory for pytest's tmp_path to avoid permission errors
# on Windows where the system-level temp dir (pytest-of-User) may be restricted.
addopts = --basetemp=.pytest_tmp
# Restrict collection to the real test suite. Fixture component tests are designed
# to be run inside their own directory by the implementation agents, not from the
# root, and collecting them here causes ModuleNotFoundError for their imports.
testpaths = tests

markers =
    integration: marks tests as integration tests that use real fixtures/ directories
    docker: marks tests that require Docker Desktop / docker compose to be running
